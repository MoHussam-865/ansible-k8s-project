# =============================================================================
# group_vars/all.yml (root level)
# =============================================================================
# Variables defined here apply to EVERY host in the inventory.
# This is the PRIMARY group_vars location when using a file-based inventory
# (ansible.cfg -> inventory = ./hosts).
#
# No fallback to inventory/production/ — the root hosts file is the source.
# The inventory/production/ directory is kept as a deprecated reference only.
# =============================================================================

---
# Kubernetes Version Settings
# ============================================================
kubernetes_release: "v1.37"
kubernetes_version: "stable"

# Container Runtime
containerd_install_method: "apt"
containerd_version: "1.7.6"
containerd_package: "containerd.io"

# Network Settings
pod_network_cidr: "10.0.0.0/16"

# Kubernetes API endpoint — dynamically resolved from the first control-plane node.
# Uses hostvars cross-group reference with groups[] index instead of hardcoded hostname.
kubernetes_api_endpoint: "{{ hostvars[groups['control-plane'][0]]['ansible_facts']['default_ipv4']['address'] }}"

# ---------------------------------------------------------------------------
# Primary (first) control-plane hostname
# ---------------------------------------------------------------------------
# Explicitly define which control-plane node is the FIRST/PRIMARY.
# This is used by roles (Calico, control-plane, etc.) that need to run
# one-time kubectl commands on a specific master.
#
# WHY THIS IS BETTER than groups['control-plane'][0]:
#   groups['control-plane'] returns hosts in INVENTORY ORDER, which may
#   not match the order you initialized them. If inventory lists master-2
#   before master-1, groups['control-plane'][0] would be master-2 — but
#   master-2 may not have been initialized yet.
#
# Set this to the FIRST host that runs kubeadm init.
# Must match the inventory hostname (e.g., control-plane-01, master-1, etc.)
# ---------------------------------------------------------------------------
kubernetes_primary_master: control-plane-01

# Kubernetes OS user
kubernetes_user: "root"

# Common packages
common_packages:
  - apt-transport-https
  - ca-certificates
  - curl
  - software-properties-common
  - python3-pip
  - gnupg
  - lsb-release
  - htop
  - net-tools
  - chrony
  - wget

# Kernel Modules
k8s_kernel_modules:
  - overlay
  - br_netfilter
  - ip_vs
  - ip_vs_rr
  - ip_vs_wrr
  - ip_vs_nq
  - ip_vs_lblc
  - ip_vs_lblcr
  - ip_vs_ftp
  - xt_connmark

# sysctl Parameters
k8s_sysctl_settings:
  net.ipv4.ip_forward: 1
  net.bridge.bridge-nf-call-iptables: 1
  net.ipv4.conf.all.rp_filter: 1
  net.core.somaxconn: 1024
  fs.file-max: 2097152
  vm.overcommit_memory: 1
  vm.swappiness: 10

# Feature Flags
run_common_role: true
run_containerd_role: true
run_kubernetes_role: true
