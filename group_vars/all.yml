# =============================================================================
# group_vars/all.yml (root level)
# =============================================================================
# Variables defined here apply to EVERY host in the inventory.
# This is the PRIMARY group_vars location when using a file-based inventory
# (ansible.cfg -> inventory = ./hosts).
#
# No fallback to inventory/production/ — the root hosts file is the source.
# The inventory/production/ directory is kept as a deprecated reference only.
# =============================================================================

---
# Kubernetes Version Settings
# ============================================================
kubernetes_release: "v1.37"
kubernetes_version: "stable"

# Container Runtime
containerd_install_method: "apt"
containerd_version: "1.7.6"
containerd_package: "containerd.io"

# Network Settings
pod_network_cidr: "10.0.0.0/16"

# Kubernetes API endpoint — dynamically resolved from the first control-plane node.
# Uses hostvars cross-group reference with groups[] index instead of hardcoded hostname.
kubernetes_api_endpoint: "{{ hostvars[groups['control-plane'][0]]['ansible_host'] }}"

# ---------------------------------------------------------------------------
# Primary (first) control-plane hostname
# ---------------------------------------------------------------------------
# Dynamically resolved from the inventory group. Uses the first host in the
# 'control-plane' group. This is compatible with both:
#   - Named aliases:  control-plane-01  ansible_host=10.1.0.10
#   - Plain IPs:      10.1.0.15   (as generated by Terraform)
#
# WHY dynamic?  Terraform generates the hosts file with plain IP addresses:
#
#     [control-plane]
#     10.1.0.15
#     10.1.0.59
#     10.1.0.49
#
# A hardcoded hostname like 'control-plane-01' would NOT match any entry
# in that inventory, causing Ansible to attempt an SSH connection to a
# non-resolvable hostname → "Temporary failure in name resolution".
#
# The Calico role's default (roles/calico/defaults/main.yml) already uses
# this same dynamic expression, but group_vars/all.yml takes precedence
# over role defaults — so keeping both in sync is essential.
#
# The control-plane role, Calico role, worker role, and verify role all
# rely on this variable for delegate_to and hostvars lookups.
# ---------------------------------------------------------------------------
kubernetes_primary_master: "{{ groups['control-plane'][0] | default('') }}"

# Kubernetes OS user
kubernetes_user: "root"

# Common packages
common_packages:
  - apt-transport-https
  - ca-certificates
  - curl
  - software-properties-common
  - python3-pip
  - gnupg
  - lsb-release
  - htop
  - net-tools
  - chrony
  - wget

# Kernel Modules
k8s_kernel_modules:
  - overlay
  - br_netfilter
  - ip_vs
  - ip_vs_rr
  - ip_vs_wrr
  - ip_vs_nq
  - ip_vs_lblc
  - ip_vs_lblcr
  - ip_vs_ftp
  - xt_connmark

# sysctl Parameters
k8s_sysctl_settings:
  net.ipv4.ip_forward: 1
  net.bridge.bridge-nf-call-iptables: 1
  net.ipv4.conf.all.rp_filter: 1
  net.core.somaxconn: 1024
  fs.file-max: 2097152
  vm.overcommit_memory: 1
  vm.swappiness: 10

# Feature Flags
run_common_role: true
run_containerd_role: true
run_kubernetes_role: true
