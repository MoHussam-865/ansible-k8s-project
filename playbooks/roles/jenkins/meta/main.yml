# =============================================================================
# roles/jenkins/meta/main.yml
# =============================================================================
# Metadata and dependencies for the Jenkins role.
# =============================================================================

---

galaxy_info:
  author: "DevOps Instructor"
  description: "Install and configure Jenkins CI/CD server with Docker"
  license: "MIT"
  min_ansible_version: "2.14.0"

  platforms:
    - name: Ubuntu
      versions:
        - "22.04"
        - "24.04"

  galaxy_tags:
    - jenkins
    - ci
    - cd
    - docker
    - automation

# ---------------------------------------------------------------------------
# Dependencies
# ---------------------------------------------------------------------------
# Jenkins needs base OS prerequisites (common role) which provides
# baseline packages like curl, wget, ca-certificates, and gnupg.
# ===========================================================================

dependencies:
  - role: common
