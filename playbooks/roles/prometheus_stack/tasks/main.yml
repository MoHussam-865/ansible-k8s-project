# =============================================================================
# roles/prometheus_stack/tasks/main.yml
# =============================================================================
# Install and configure Prometheus + Grafana monitoring stack.
#
# This role runs on the 'monitoring' group host(s). It:
#   1. Installs Prometheus (tarball from GitHub releases)
#   2. Configures Prometheus to scrape all cluster Node Exporters
#   3. Installs Grafana (APT from official repo)
# =============================================================================

---

# =============================================================================
# BUILD TARGET LIST: Collect all cluster node_exporter endpoints
# =============================================================================
# We iterate over all cluster hosts and build a list of "ip:9100" targets
# for Prometheus to scrape. The loop + set_fact pattern accumulates items
# across iterations (standard Ansible pattern).
# =============================================================================

- name: Initialize prometheus_scrape_targets as empty list
  ansible.builtin.set_fact:
    prometheus_scrape_targets: []
  run_once: true
  when: run_prometheus_role | bool
  tags:
    - prometheus
    - config

- name: Initialize haproxy_stats_targets as empty list
  ansible.builtin.set_fact:
    haproxy_stats_targets: []
  run_once: true
  when: run_prometheus_role | bool
  tags:
    - prometheus
    - config

- name: Build node_exporter target list for Prometheus
  ansible.builtin.set_fact:
    prometheus_scrape_targets: "{{ prometheus_scrape_targets + [(hostvars[item]['ansible_host'] | default(hostvars[item]['inventory_hostname'], true)) ~ ':9100'] }}"
  loop: "{{ groups['cluster'] }}"
  when:
    - run_prometheus_role | bool
    - hostvars[item]['ansible_host'] is defined or hostvars[item]['inventory_hostname'] is defined
  run_once: true
  tags:
    - prometheus
    - config

- name: Build HAProxy stats target list for Prometheus
  ansible.builtin.set_fact:
    haproxy_stats_targets: "{{ haproxy_stats_targets + [(hostvars[item]['ansible_host'] | default(hostvars[item]['inventory_hostname'], true)) ~ ':8404' ] }}"
  loop: "{{ groups['haproxy'] | default([]) }}"
  when:
    - run_prometheus_role | bool
    - hostvars[item]['ansible_host'] is defined or hostvars[item]['inventory_hostname'] is defined
  run_once: true
  tags:
    - prometheus
    - config
# =============================================================================
# PROMETHEUS SETUP — user, directories, download, install, config, service
# =============================================================================

- name: Create prometheus system user
  ansible.builtin.user:
    name: "{{ prometheus_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false
    state: present
  become: true
  when: run_prometheus_role | bool
  tags:
    - prometheus
    - users

- name: Create prometheus data directory
  ansible.builtin.file:
    path: "{{ prometheus_data_dir }}"
    state: directory
    mode: "0755"
    owner: "{{ prometheus_user }}"
    group: "{{ prometheus_group }}"
  become: true
  when: run_prometheus_role | bool
  tags:
    - prometheus
    - directories

- name: Create prometheus config directory
  ansible.builtin.file:
    path: "{{ prometheus_config_dir }}"
    state: directory
    mode: "0755"
    owner: "{{ prometheus_user }}"
    group: "{{ prometheus_group }}"
  become: true
  when: run_prometheus_role | bool
  tags:
    - prometheus
    - directories

- name: Create prometheus install directory
  ansible.builtin.file:
    path: "{{ prometheus_install_dir }}"
    state: directory
    mode: "0755"
    owner: "{{ prometheus_user }}"
    group: "{{ prometheus_group }}"
  become: true
  when: run_prometheus_role | bool
  tags:
    - prometheus
    - directories

- name: Download Prometheus tarball
  ansible.builtin.get_url:
    url: "{{ prometheus_download_url }}"
    dest: "{{ prometheus_download_dest }}"
    timeout: 60
    mode: "0644"
  become: true
  register: download_prometheus
  until: download_prometheus is success
  retries: 3
  delay: 5
  when: run_prometheus_role | bool
  tags:
    - prometheus
    - download


- name: Extract Prometheus tarball
  ansible.builtin.unarchive:
    src: "{{ prometheus_download_dest }}"
    dest: /tmp
    remote_src: true
    creates: "/tmp/{{ prometheus_archive_dir }}/prometheus"
  become: true
  when: run_prometheus_role | bool
  tags:
    - prometheus
    - extract

- name: Copy prometheus binary to install directory
  ansible.builtin.copy:
    src: "/tmp/{{ prometheus_archive_dir }}/prometheus"
    dest: "{{ prometheus_binary }}"
    mode: "0755"
    owner: "{{ prometheus_user }}"
    group: "{{ prometheus_group }}"
    remote_src: true
  become: true
  notify: restart prometheus
  when: run_prometheus_role | bool
  tags:
    - prometheus
    - binary

- name: Copy promtool binary
  ansible.builtin.copy:
    src: "/tmp/{{ prometheus_archive_dir }}/promtool"
    dest: "{{ prometheus_install_dir }}/promtool"
    mode: "0755"
    owner: "{{ prometheus_user }}"
    group: "{{ prometheus_group }}"
    remote_src: true
  become: true
  when: run_prometheus_role | bool
  tags:
    - prometheus
    - binary

- name: Deploy Prometheus YAML configuration
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: "{{ prometheus_config_file }}"
    mode: "0644"
    owner: "{{ prometheus_user }}"
    group: "{{ prometheus_group }}"
  become: true
  notify: restart prometheus
  when: run_prometheus_role | bool
  tags:
    - prometheus
    - config

- name: Deploy Prometheus systemd service
  ansible.builtin.template:
    src: prometheus.service.j2
    dest: /etc/systemd/system/{{ prometheus_service_name }}.service
    mode: "0644"
    owner: root
    group: root
  become: true
  notify: restart prometheus
  when: run_prometheus_role | bool
  tags:
    - prometheus
    - service

- name: Reload systemd daemon
  ansible.builtin.systemd:
    daemon_reload: true
  become: true
  when: run_prometheus_role | bool
  tags:
    - prometheus
    - service

- name: Enable and start Prometheus service
  ansible.builtin.service:
    name: "{{ prometheus_service_name }}"
    state: started
    enabled: true
  become: true
  when: run_prometheus_role | bool
  tags:
    - prometheus
    - service

- name: Wait for Prometheus to be ready
  ansible.builtin.wait_for:
    port: "{{ prometheus_port }}"
    host: "{{ ansible_facts['default_ipv4']['address'] }}"
    timeout: 60
    connect_timeout: 2
  become: true
  when: run_prometheus_role | bool
  tags:
    - prometheus
    - verify

# =============================================================================
# GRAFANA SETUP — APT repo, install, service
# =============================================================================

- name: Add Grafana APT key
  ansible.builtin.apt_key:
    url: "{{ grafana_apt_key_url }}"
    state: present
  become: true
  when: run_grafana_role | bool
  tags:
    - grafana
    - repository

- name: Add Grafana APT repository
  ansible.builtin.apt_repository:
    repo: "deb {{ grafana_apt_repo_url }} stable main"
    state: present
    update_cache: true
  become: true
  when: run_grafana_role | bool
  tags:
    - grafana
    - repository

- name: Install Grafana package
  ansible.builtin.apt:
    name: grafana
    state: present
  become: true
  when: run_grafana_role | bool
  tags:
    - grafana
    - packages

- name: Enable and start Grafana service
  ansible.builtin.service:
    name: "{{ grafana_service_name }}"
    state: started
    enabled: true
  become: true
  when: run_grafana_role | bool
  tags:
    - grafana
    - service

- name: Wait for Grafana to be ready
  ansible.builtin.wait_for:
    port: "{{ grafana_port }}"
    host: "{{ ansible_facts['default_ipv4']['address'] }}"
    timeout: 60
    connect_timeout: 2
  become: true
  when: run_grafana_role | bool
  tags:
    - grafana
    - verify