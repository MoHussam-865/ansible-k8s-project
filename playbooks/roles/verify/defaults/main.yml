# =============================================================================
# roles/verify/defaults/main.yml
# =============================================================================
# Default variables for the Verification role.
# =============================================================================

---
# ---------------------------------------------------------------------------
# Verification behaviour
# ---------------------------------------------------------------------------

# Fail the playbook if any verification check fails?
# true  = playbook stops on first failure
# false = playbook continues, reports all failures at end
verify_fail_on_error: false

# Path to kubectl binary
kubectl_binary: /usr/bin/kubectl

# Control plane hostname (for running kubectl commands)
verify_control_plane_host: "{{ groups['control-plane'][0] }}"

# ---------------------------------------------------------------------------
# Service check list — services to verify on each host group
# ---------------------------------------------------------------------------

verify_services:
  - name: containerd
    host_group: all
  - name: kubelet
    host_group: all
  - name: "{{ node_exporter_service_name | default('prometheus-node-exporter') }}"
    host_group: cluster
  - name: "{{ prometheus_service_name | default('prometheus') }}"
    host_group: monitoring
  - name: "{{ grafana_service_name | default('grafana-server') }}"
    host_group: monitoring