# =============================================================================
# roles/control-plane/tasks/main.yml
# =============================================================================
# Initialize the Kubernetes control plane using kubeadm.
#
# =============================================================================
# WHAT THIS ROLE DOES
# =============================================================================
#   1. Ensure prerequisites are in place
#   2. Run 'kubeadm init' to bootstrap the cluster
#   3. Register the output to capture the join command
#   4. Store the join command as a fact (accessible to ALL hosts)
#   5. Configure kubelet for the control plane
#   6. Start kubelet service
#
# =============================================================================
# NEW ANSIBLE CONCEPTS INTRODUCED
# =============================================================================
#
#   register:
#     Captures the RESULT of a task into a variable.
#     The variable contains dict fields:
#       .rc          — return code (0 = success)
#       .stdout      — full standard output (string)
#       .stdout_lines — stdout split into lines (list)
#       .stderr      — full error output
#       .changed     — whether the task reported a change
#
#     Where does the variable live?
#       In the host's 'hostvars' dictionary for the CURRENT play.
#       It persists for the DURATION of the playbook run.
#       Other hosts access it via: hostvars['hostname']['variable_name']
#
#   set_fact:
#     Creates (or overwrites) a variable at RUNTIME.
#     Unlike inventory variables, set_fact values are computed during execution.
#     They are accessible across plays via hostvars.
#
#   run_once: true
#     Ensures a task runs ONLY ONCE, even when the play targets multiple hosts.
#     Example: kubeadm init should run on exactly ONE control-plane node.
#     Without this, it would run on EVERY host in the group.
#
#   delegate_to:
#     Runs a task on a DIFFERENT host than the play's target.
#     Example: from a play targeting 'workers', you can delegate a task
#     to run on the control plane.
# =============================================================================

---
# =============================================================================
# TASK 1: Ensure Kubernetes etc directory exists
# =============================================================================
# kubeadm writes config files to /etc/kubernetes/.
# We ensure the directory is present before running kubeadm.
# =============================================================================

- name: Ensure Kubernetes configuration directory exists
  ansible.builtin.file:
    path: "{{ kubernetes_etc_dir }}"
    state: directory
    mode: "0755"
  become: true
  tags:
    - control-plane
    - kubeadm

# =============================================================================
# TASK 2: Check if cluster is already initialized
# =============================================================================
# Idempotency check: if the cluster certificates already exist,
# kubeadm has already been initialized and we should NOT run it again.
#
# Why check for certificates?
#   kubeadm init generates a Certificate Authority (CA) and TLS certificates.
#   If they exist, the cluster IS already bootstrapped.
#   Running 'kubeadm init' again would fail or overwrite them.
# =============================================================================

- name: Check if cluster is already initialized
  ansible.builtin.stat:
    path: /etc/kubernetes/pki/ca.crt
  register: cluster_ca_check
  changed_when: false
  tags:
    - control-plane
    - kubeadm

# =============================================================================
# TASK 3: Generate / retrieve certificate key for --upload-certs
# =============================================================================
# Additional masters need a certificate key to decrypt the uploaded
# certificates. The key must be generated BEFORE kubeadm init and passed
# via --certificate-key, so the upload uses the SAME key we store.
# On first run we generate a new key; on re-runs we read from file.
# =============================================================================

- name: Check if certificate key file already exists (re-run)
  ansible.builtin.stat:
    path: "{{ kubeadm_cert_key_file }}"
  register: kubeadm_cert_key_file_check
  run_once: true
  tags:
    - control-plane
    - kubeadm
    - multi-master

- name: Generate certificate key for additional masters (first run)
  ansible.builtin.command:
    cmd: kubeadm certs certificate-key
  register: kubeadm_cert_key_gen
  changed_when: false
  run_once: true
  when:
    - run_kubeadm_init | bool
    - not kubeadm_cert_key_file_check.stat.exists
  tags:
    - control-plane
    - kubeadm
    - multi-master

- name: Store generated certificate key as a fact
  ansible.builtin.set_fact:
    kubeadm_certificate_key_raw: "{{ kubeadm_cert_key_gen.stdout | default('') | trim }}"
  run_once: true
  when:
    - run_kubeadm_init | bool
    - kubeadm_cert_key_gen is defined
    - kubeadm_cert_key_gen.stdout is defined
    - kubeadm_cert_key_gen.stdout | length > 0
  tags:
    - control-plane
    - kubeadm
    - multi-master

- name: Read certificate key from file on re-run
  ansible.builtin.slurp:
    src: "{{ kubeadm_cert_key_file }}"
  register: kubeadm_cert_key_file_content
  run_once: true
  when:
    - run_kubeadm_init | bool
    - kubeadm_cert_key_file_check.stat.exists
    - kubeadm_certificate_key_raw is not defined or kubeadm_certificate_key_raw | length == 0
  tags:
    - control-plane
    - kubeadm
    - multi-master

- name: Set certificate key from file (fallback on re-run)
  ansible.builtin.set_fact:
    kubeadm_certificate_key_raw: "{{ kubeadm_cert_key_file_content.content | b64decode | trim }}"
  run_once: true
  when:
    - run_kubeadm_init | bool
    - kubeadm_cert_key_file_content.skipped is not defined
    - kubeadm_cert_key_file_content.content is defined
    - kubeadm_cert_key_file_content.content | length > 0
  tags:
    - control-plane
    - kubeadm
    - multi-master

# =============================================================================
# TASK 4: Run kubeadm init with the certificate key
# =============================================================================
# We pass --certificate-key with the SAME key we generated/stored above,
# ensuring that the uploaded certificates can be decrypted by additional
# masters using the same key.
# =============================================================================

- name: Initialize Kubernetes cluster with kubeadm
  ansible.builtin.command:
    cmd: >-
      kubeadm init
        --pod-network-cidr={{ kubeadm_pod_network_cidr }}
        --control-plane-endpoint={{ kubeadm_apiserver_endpoint }}
        --upload-certs
        --certificate-key={{ kubeadm_certificate_key_raw }}
  become: true
  when:
    - run_kubeadm_init | bool
    - not cluster_ca_check.stat.exists
    - kubeadm_certificate_key_raw is defined
    - kubeadm_certificate_key_raw | length > 0
  register: kubeadm_init_result
  changed_when: kubeadm_init_result.rc == 0
  # ---------------------------------------------------------------------------
  # run_once: true
  #   This is CRITICAL. Without it, 'kubeadm init' would run on EVERY
  #   host in the control-plane group. With 3 control-plane nodes in prod,
  #   you'd get 3 clusters instead of 1.
  # ---------------------------------------------------------------------------
  run_once: true
  tags:
    - control-plane
    - kubeadm

- name: Write certificate key to persistent file
  ansible.builtin.copy:
    content: "{{ kubeadm_certificate_key_raw }}"
    dest: "{{ kubeadm_cert_key_file }}"
    mode: "0600"
  become: true
  run_once: true
  when:
    - run_kubeadm_init | bool
    - kubeadm_certificate_key_raw is defined
    - kubeadm_certificate_key_raw | length > 0
  tags:
    - control-plane
    - kubeadm
    - multi-master

# =============================================================================
# TASK 4: Extract the join command from kubeadm output
# =============================================================================
# kubeadm init outputs a line starting with 'kubeadm join'.
# We extract this line using a Jinja2 filter.
#
# Jinja2 filters used:
#   | select('match', '^kubeadm join')
#     Filters a list to only items matching a regex pattern.
#   | first
#     Takes the first (and hopefully only) item from the filtered list.
#
# Note about 'select':
#   'select' is a Jinja2 TEST filter. It applies the TEST (match())
#   to each element and keeps those where the TEST returns True.
# =============================================================================

- name: Generate a clean join command string
  ansible.builtin.command: kubeadm token create --print-join-command
  register: generated_join_command
  changed_when: false
  run_once: true
  tags:
    - control-plane
    - kubeadm

- name: Store kubeadm join command as a fact
  ansible.builtin.set_fact:
    kubeadm_join_command_raw: "{{ generated_join_command.stdout }}"
  run_once: true
  when:
    - generated_join_command.stdout is defined
    - generated_join_command.stdout | length > 0
  tags:
    - control-plane
    - kubeadm

# =============================================================================
# TASK 5: Write join command to a file (persistence)
# =============================================================================
# In-memory variables (set_fact) disappear when the playbook ends.
# To be safe, we also write the join command to a FILE on the control plane.
# This file persists across playbook runs.
#
# You can read it later with:
#   ansible control-plane-01 -m fetch -a "src=/var/lib/kubeadm/join-command.txt dest=./"
# =============================================================================

- name: Ensure kubeadm directory exists
  ansible.builtin.file:
    path: "{{ kubeadm_data_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: true

- name: Write join command to persistent file
  ansible.builtin.copy:
    content: "{{ kubeadm_join_command_raw }}"
    dest: "{{ kubeadm_join_command_file }}"
    mode: "0644"
  become: true
  run_once: true
  when:
    - kubeadm_join_command_raw is defined
    - kubeadm_join_command_raw | length > 0
  tags:
    - control-plane
    - kubeadm

# =============================================================================
# TASK 6: Deploy kubelet configuration for control plane
# =============================================================================
# kubelet needs to know it is a control-plane node.
# We deploy a kubelet config template.
# =============================================================================
- name: Ensure /etc/kubernetes/kubelet directory exists
  ansible.builtin.file:
    path: /etc/kubernetes/kubelet
    state: directory
    mode: "0755"
    owner: root
    group: root
  become: true

  
- name: Deploy kubelet configuration for control plane
  ansible.builtin.template:
    src: kubelet-config.yaml.j2
    dest: "{{ kubelet_config_file }}"
    mode: "0644"
  become: true
  notify: restart kubelet
  tags:
    - control-plane
    - config

# =============================================================================
# TASK 7: Ensure kubelet is running
# =============================================================================
# After kubeadm init, kubelet needs to be restarted to pick up the new config.
# =============================================================================

- name: Ensure kubelet is running and enabled
  ansible.builtin.service:
    name: "{{ kubelet_service_name }}"
    state: started
    enabled: true
  become: true
  tags:
    - control-plane
    - service


- name: Ensure .kube directory exists for the regular user
  ansible.builtin.file:
    path: "/home/{{ ansible_user }}/.kube"
    state: directory
    mode: "0755"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
  become: true

- name: Copy admin.conf to user's kubeconfig
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: "/home/{{ ansible_user }}/.kube/config"
    remote_src: yes
    mode: "0600"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
  become: true
  
# =============================================================================
# TASK 8: Display join command (informational)
# =============================================================================
# Show the join command in the Ansible output so you can see it.
# This is a debugging/teaching task — in production you'd log it.
# =============================================================================

- name: Display kubeadm join command
  ansible.builtin.debug:
    msg:
      - "=== CLUSTER INITIALIZED ==="
      - "Join command for workers:"
      - "{{ kubeadm_join_command_raw | default('(already initialized — check /var/lib/kubeadm/join-command.txt)') }}"
  run_once: true
  tags:
    - control-plane
    - kubeadm
