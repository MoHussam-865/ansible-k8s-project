# =============================================================================
# roles/control-plane/tasks/main.yml
# =============================================================================
# Bootstrap ALL Kubernetes control-plane nodes (first master + additional).
#
# =============================================================================
# WHAT THIS ROLE DOES
# =============================================================================
#   FIRST MASTER (run_once):
#     1. Ensure prerequisites are in place
#     2. Generate / retrieve the certificate key for --upload-certs
#     3. Run 'kubeadm init' to bootstrap the cluster
#     4. Capture the join command and certificate key
#     5. Persist them to files for re-runs
#
#   ADDITIONAL MASTERS (run on rest):
#     6. Retrieve the certificate key + join command from the first master
#     7. Build the full join command with --control-plane --certificate-key
#     8. Run 'kubeadm join --control-plane' to join the cluster
#
#   ALL MASTERS:
#     9. Deploy kubelet configuration
#    10. Start kubelet service
#    11. Copy admin.conf for kubectl access
#
# =============================================================================
# WHY run_once: true ON FIRST-MASTER TASKS
# =============================================================================
# When the play targets ALL control-plane hosts, run_once: true ensures
# that 'kubeadm init' runs on exactly ONE node. All other hosts wait
# for it to finish, guaranteeing that the cluster exists BEFORE any
# additional master attempts to join.
#
# After the first master's init is complete, its set_fact values are
# available via hostvars[groups['control-plane'][0]] for the rest of
# the play.
# =============================================================================
#
# =============================================================================
# NEW ANSIBLE CONCEPTS INTRODUCED
# =============================================================================
#
#   register:
#     Captures the RESULT of a task into a variable.
#     The variable contains dict fields:
#       .rc          — return code (0 = success)
#       .stdout      — full standard output (string)
#       .stdout_lines — stdout split into lines (list)
#       .stderr      — full error output
#       .changed     — whether the task reported a change
#
#     Where does the variable live?
#       In the host's 'hostvars' dictionary for the CURRENT play.
#       It persists for the DURATION of the playbook run.
#       Other hosts access it via: hostvars['hostname']['variable_name']
#
#   set_fact:
#     Creates (or overwrites) a variable at RUNTIME.
#     Unlike inventory variables, set_fact values are computed during execution.
#     They are accessible across plays via hostvars.
#
#   run_once: true
#     Ensures a task runs ONLY ONCE, even when the play targets multiple hosts.
#     Example: kubeadm init should run on exactly ONE control-plane node.
#     Without this, it would run on EVERY host in the group.
#
#   delegate_to:
#     Runs a task on a DIFFERENT host than the play's target.
#     Example: from a play targeting 'workers', you can delegate a task
#     to run on the control plane.
# =============================================================================

---
# =============================================================================
# TASK 1: Ensure Kubernetes etc directory exists
# =============================================================================
# kubeadm writes config files to /etc/kubernetes/.
# We ensure the directory is present before running kubeadm.
# =============================================================================

- name: Ensure Kubernetes configuration directory exists
  ansible.builtin.file:
    path: "{{ kubernetes_etc_dir }}"
    state: directory
    mode: "0755"
  become: true
  tags:
    - control-plane
    - kubeadm

# =============================================================================
# TASK 2: Check if cluster is already initialized
# =============================================================================
# Idempotency check: if the cluster certificates already exist,
# kubeadm has already been initialized and we should NOT run it again.
#
# Why check for certificates?
#   kubeadm init generates a Certificate Authority (CA) and TLS certificates.
#   If they exist, the cluster IS already bootstrapped.
#   Running 'kubeadm init' again would fail or overwrite them.
# =============================================================================

- name: Check if node already has cluster certificates (idempotency)
  ansible.builtin.stat:
    path: /etc/kubernetes/pki/ca.crt
  register: cluster_ca_check
  changed_when: false
  tags:
    - control-plane
    - kubeadm

# =============================================================================
# FIRST MASTER ONLY (run_once) — kubeadm init + upload-certs + join command
# =============================================================================
# These tasks run ONLY on the first control-plane node.
# run_once: true ensures they execute exactly once; all other hosts wait
# for completion before proceeding. This guarantees the cluster exists
# BEFORE additional masters attempt to join.
#
# FLOW FOR FIRST MASTER:
#   1. Run 'kubeadm init' to bootstrap the cluster
#      --control-plane-endpoint=<HAPROXY_IP>
#          Workers reach the API via HAProxy (load-balanced).
#      --apiserver-advertise-address=<MASTER_IP>
#          The master's OWN private IP for node-to-node operations
#          (certificate upload, mutual TLS handshake during join).
#      --upload-certs
#          Upload CA certificates to the datastore (auto-generates an
#          encryption key; NO --certificate-key is passed).
#      --pod-network-cidr=<CIDR>
#          Subnet for pod-to-pod networking.
#   2. Run 'kubeadm init phase upload-certs --upload-certs' to capture the
#      auto-generated certificate key. Additional masters need this key
#      when they join with --control-plane.
#   3. Generate the worker join command via kubeadm token create
#      --print-join-command (already includes --discovery-token-ca-cert-hash).
#   4. Persist the certificate key and join command to files for re-run
#      fallback (so other hosts can access them via hostvars or slurp).
# =============================================================================

- name: Check if certificate key file already exists (re-run)
  ansible.builtin.stat:
    path: "{{ kubeadm_cert_key_file }}"
  register: kubeadm_cert_key_file_check
  run_once: true
  tags:
    - control-plane
    - kubeadm
    - multi-master

- name: Read certificate key from file on re-run
  ansible.builtin.slurp:
    src: "{{ kubeadm_cert_key_file }}"
  register: kubeadm_cert_key_file_content
  run_once: true
  when:
    - run_kubeadm_init | bool
    - kubeadm_cert_key_file_check.stat.exists
    - kubeadm_certificate_key_raw is not defined or kubeadm_certificate_key_raw | length == 0
  tags:
    - control-plane
    - kubeadm
    - multi-master

- name: Set certificate key from file (fallback on re-run)
  ansible.builtin.set_fact:
    kubeadm_certificate_key_raw: "{{ kubeadm_cert_key_file_content.content | b64decode | trim }}"
  run_once: true
  when:
    - run_kubeadm_init | bool
    - kubeadm_cert_key_file_content.skipped is not defined
    - kubeadm_cert_key_file_content.content is defined
    - kubeadm_cert_key_file_content.content | length > 0
  tags:
    - control-plane
    - kubeadm
    - multi-master

# =============================================================================
# TASK: kubeadm init — FIRST MASTER ONLY
# =============================================================================
# We pass --upload-certs WITHOUT --certificate-key, which tells kubeadm to
# auto-generate an encryption key and upload the CA certificates encrypted
# with it. After init completes, we run 'kubeadm init phase upload-certs
# --upload-certs' to retrieve that auto-generated key for use by additional
# masters joining with --control-plane.
#
# CRITICAL: --apiserver-advertise-address
#   This MUST be the first master's own private IP so that additional nodes
#   can reach it directly for the join handshake (certificate verification,
#   mutual TLS). Without this flag, nodes attempt to reach the HAProxy
#   endpoint for internal cluster operations, which breaks the join flow
#   because certificate upload and node-to-node registration require a
#   direct TLS handshake with the master that holds the CA private key.
# =============================================================================

- name: Initialize Kubernetes cluster with kubeadm (FIRST MASTER ONLY)
  ansible.builtin.command:
    cmd: >-
      kubeadm init
        --pod-network-cidr={{ kubeadm_pod_network_cidr }}
        --control-plane-endpoint={{ kubeadm_apiserver_endpoint }}
        --apiserver-advertise-address={{ kubeadm_apiserver_advertise_address }}
        --upload-certs
  become: true
  when:
    - run_kubeadm_init | bool
    - not cluster_ca_check.stat.exists
  register: kubeadm_init_result
  changed_when: kubeadm_init_result.rc == 0
  # ---------------------------------------------------------------------------
  # run_once: true
  #   This is CRITICAL. Without it, 'kubeadm init' would run on EVERY
  #   host in the control-plane group. With 3 control-plane nodes,
  #   you'd get 3 clusters instead of 1.
  # ---------------------------------------------------------------------------
  run_once: true
  tags:
    - control-plane
    - kubeadm

# =============================================================================
# TASK: Upload certificates and capture certificate key — FIRST MASTER ONLY
# =============================================================================
# After init with --upload-certs, the CA certificates are stored in the
# datastore encrypted with an auto-generated key. Running:
#   kubeadm init phase upload-certs --upload-certs
# prints that key to stdout. Additional masters need this key to join with
# --certificate-key (they decrypt the uploaded CA certs with it).
# =============================================================================

- name: Upload certificates and capture certificate key (FIRST MASTER ONLY)
  ansible.builtin.command:
    cmd: kubeadm init phase upload-certs --upload-certs
  become: true
  register: kubeadm_upload_certs_result
  changed_when: false
  when:
    - run_kubeadm_init | bool
    - not cluster_ca_check.stat.exists
  run_once: true
  tags:
    - control-plane
    - kubeadm
    - multi-master

- name: Store certificate key from upload-certs output
  ansible.builtin.set_fact:
    # kubeadm init phase upload-certs --upload-certs outputs:
    #   [upload-certs] Storing the certificates in Secret "kubeadm-certs" in the "kube-system" Namespace
    #   [upload-certs] Using certificate key:
    #   <CERTIFICATE_KEY>
    # We need ONLY the actual certificate key (the last non-empty line).
    kubeadm_certificate_key_raw: "{{ (kubeadm_upload_certs_result.stdout | trim).split('\\n') | last | trim }}"
  run_once: true
  when:
    - run_kubeadm_init | bool
    - kubeadm_upload_certs_result is defined
    - kubeadm_upload_certs_result.stdout is defined
    - kubeadm_upload_certs_result.stdout | length > 0
  tags:
    - control-plane
    - kubeadm
    - multi-master

- name: Ensure kubeadm data directory exists (FIRST MASTER)
  ansible.builtin.file:
    path: "{{ kubeadm_data_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: true
  run_once: true
  tags:
    - control-plane
    - kubeadm

- name: Write certificate key to persistent file
  ansible.builtin.copy:
    content: "{{ kubeadm_certificate_key_raw }}"
    dest: "{{ kubeadm_cert_key_file }}"
    mode: "0600"
  become: true
  run_once: true
  when:
    - run_kubeadm_init | bool
    - kubeadm_certificate_key_raw is defined
    - kubeadm_certificate_key_raw | length > 0
  tags:
    - control-plane
    - kubeadm
    - multi-master

# =============================================================================
# TASK: Generate join command — FIRST MASTER ONLY
# =============================================================================
# kubeadm token create --print-join-command generates a worker join command
# with a fresh bootstrap token. Additional masters will append
# --control-plane --certificate-key=<key> to this command.
# =============================================================================

- name: Generate a clean join command string (FIRST MASTER ONLY)
  ansible.builtin.command: kubeadm token create --print-join-command
  register: generated_join_command
  changed_when: false
  run_once: true
  tags:
    - control-plane
    - kubeadm

- name: Store kubeadm join command as a fact
  ansible.builtin.set_fact:
    kubeadm_join_command_raw: "{{ generated_join_command.stdout | trim }}"
  run_once: true
  when:
    - generated_join_command.stdout is defined
    - generated_join_command.stdout | length > 0
  tags:
    - control-plane
    - kubeadm

- name: Write join command to persistent file
  ansible.builtin.copy:
    content: "{{ kubeadm_join_command_raw }}"
    dest: "{{ kubeadm_join_command_file }}"
    mode: "0644"
  become: true
  run_once: true
  when:
    - kubeadm_join_command_raw is defined
    - kubeadm_join_command_raw | length > 0
  tags:
    - control-plane
    - kubeadm

# =============================================================================
# ADDITIONAL MASTERS ONLY — Retrieve join info + join the cluster
# =============================================================================
# These tasks run ONLY on control-plane nodes that are NOT the first master.
# They retrieve the certificate key and join command from the first master's
# hostvars (or read from files as fallback), build the full join command
# with --control-plane --certificate-key, and run kubeadm join.
#
# The final join command for additional masters looks like:
#   kubeadm join <HAPROXY_IP>:6443 \
#       --token=<TOKEN> \
#       --discovery-token-ca-cert-hash=sha256:<HASH> \
#       --control-plane \
#       --certificate-key=<KEY>
# =============================================================================

- name: Retrieve certificate key from first master hostvars
  ansible.builtin.set_fact:
    master_certificate_key: "{{ hostvars[groups['control-plane'][0]]['kubeadm_certificate_key_raw'] | default('') }}"
  when:
    - inventory_hostname != groups['control-plane'][0]
  tags:
    - control-plane
    - multi-master

- name: Fallback — read certificate key from file on first master
  ansible.builtin.slurp:
    src: "{{ kubeadm_cert_key_file }}"
  delegate_to: "{{ groups['control-plane'][0] }}"
  register: master_cert_key_file
  when:
    - inventory_hostname != groups['control-plane'][0]
    - master_certificate_key | length == 0
  tags:
    - control-plane
    - multi-master

- name: Set certificate key from file if hostvars was empty
  ansible.builtin.set_fact:
    master_certificate_key: "{{ master_cert_key_file.content | b64decode | trim }}"
  when:
    - inventory_hostname != groups['control-plane'][0]
    - master_cert_key_file.skipped is not defined
    - master_cert_key_file.content is defined
    - master_cert_key_file.content | length > 0
  tags:
    - control-plane
    - multi-master

- name: Retrieve join command from first master hostvars
  ansible.builtin.set_fact:
    master_join_command: "{{ hostvars[groups['control-plane'][0]]['kubeadm_join_command_raw'] | default('') }}"
  when:
    - inventory_hostname != groups['control-plane'][0]
  tags:
    - control-plane
    - multi-master

- name: Fallback — read join command from file on first master
  ansible.builtin.slurp:
    src: "{{ kubeadm_join_command_file }}"
  delegate_to: "{{ groups['control-plane'][0] }}"
  register: master_join_file
  when:
    - inventory_hostname != groups['control-plane'][0]
    - master_join_command | length == 0
  tags:
    - control-plane
    - multi-master

- name: Set join command from file if hostvars was empty
  ansible.builtin.set_fact:
    master_join_command: "{{ master_join_file.content | b64decode | trim }}"
  when:
    - inventory_hostname != groups['control-plane'][0]
    - master_join_file.skipped is not defined
    - master_join_file.content is defined
    - master_join_file.content | length > 0
  tags:
    - control-plane
    - multi-master

- name: Build full join command with --control-plane flag
  ansible.builtin.set_fact:
    master_full_join_command: "{{ master_join_command }} --control-plane --certificate-key={{ master_certificate_key }}"
  when:
    - inventory_hostname != groups['control-plane'][0]
    - master_join_command | length > 0
    - master_certificate_key | length > 0
  tags:
    - control-plane
    - multi-master

- name: Join the cluster as an additional master
  ansible.builtin.command:
    cmd: "{{ master_full_join_command }}"
  become: true
  when:
    - inventory_hostname != groups['control-plane'][0]
    - master_full_join_command is defined
    - master_full_join_command | length > 0
    - not cluster_ca_check.stat.exists
  register: additional_master_join_result
  changed_when: additional_master_join_result.rc == 0
  tags:
    - control-plane
    - multi-master

# =============================================================================
# ALL MASTERS — kubelet configuration, service, admin.conf
# =============================================================================
# These tasks run on EVERY control-plane node (first AND additional).
# They deploy the kubelet config, ensure the service is running, and
# copy the admin kubeconfig for the ansible user.
# =============================================================================

- name: Ensure /etc/kubernetes/kubelet directory exists
  ansible.builtin.file:
    path: /etc/kubernetes/kubelet
    state: directory
    mode: "0755"
    owner: root
    group: root
  become: true

- name: Deploy kubelet configuration for control plane
  ansible.builtin.template:
    src: kubelet-config.yaml.j2
    dest: "{{ kubelet_config_file }}"
    mode: "0644"
  become: true
  notify: restart kubelet
  tags:
    - control-plane
    - config

- name: Ensure kubelet is running and enabled
  ansible.builtin.service:
    name: "{{ kubelet_service_name }}"
    state: started
    enabled: true
  become: true
  tags:
    - control-plane
    - service

- name: Ensure .kube directory exists for the regular user
  ansible.builtin.file:
    path: "/home/{{ ansible_user }}/.kube"
    state: directory
    mode: "0755"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
  become: true

- name: Copy admin.conf to user's kubeconfig
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: "/home/{{ ansible_user }}/.kube/config"
    remote_src: yes
    mode: "0600"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
  become: true

# =============================================================================
# Display cluster status
# =============================================================================

- name: Display control-plane status
  ansible.builtin.debug:
    msg:
      - "=== CONTROL PLANE NODE READY ==="
      - "Node: {{ ansible_hostname }}"
      - "Role: {{ 'First master (initialized cluster)' if inventory_hostname == groups['control-plane'][0] else 'Additional master (joined cluster)' }}"
      - "Join command for workers: {{ kubeadm_join_command_raw | default('(see /var/lib/kubeadm/join-command.txt on first master)') }}"
  tags:
    - control-plane
    - kubeadm
