# =============================================================================
# roles/control-plane/defaults/main.yml
# =============================================================================
# Default variables for the Control Plane role.
# =============================================================================

---
# ---------------------------------------------------------------------------
# kubeadm init options
# ---------------------------------------------------------------------------
# These are the flags passed to 'kubeadm init' when bootstrapping.
# Each option is explained in tasks/main.yml where it's used.
# ---------------------------------------------------------------------------

# Pod network CIDR — the subnet used for container-to-container traffic
kubeadm_pod_network_cidr: "{{ pod_network_cidr | default('10.0.0.0/16') }}"

# Advertise address — the IP this master uses for node-to-node communication
# This MUST be the first master's own private IP (not the HAProxy IP).
# Workers and additional masters need this address during the join handshake
# to perform mutual TLS verification and download CA certificates.
# Defaults to ansible_host (the IP Ansible uses to connect).
# Override in group_vars/control-plane.yml if your cluster topology requires it.
kubeadm_apiserver_advertise_address: "{{ ansible_host | default(inventory_hostname, true) }}"

# API server endpoint — the host:port workers use to reach the Kubernetes API
# Through HAProxy, not directly at a specific master's IP.
# Must NOT include the https:// protocol — kubeadm's --control-plane-endpoint
# flag expects a bare <host>:<port> string.
kubeadm_apiserver_endpoint: "{{ control_plane_endpoint | default((ansible_host | default(inventory_hostname, true)) ~ ':' ~ (kubernetes_api_port | default('6443'))) }}"

# Directory where kubeadm stores cluster certificates and config
kubeadm_data_dir: /var/lib/kubeadm

# Where to write the join command so workers can read it
kubeadm_join_command_file: /var/lib/kubeadm/join-command.txt

# Where to write the certificate key for additional masters
kubeadm_cert_key_file: /var/lib/kubeadm/certificate-key.txt

# ---------------------------------------------------------------------------
# kubelet configuration for the control plane
# ---------------------------------------------------------------------------

kubelet_config_file: /etc/kubernetes/kubelet/config.yaml

# ---------------------------------------------------------------------------
# Feature flags
# ---------------------------------------------------------------------------

run_kubeadm_init: true