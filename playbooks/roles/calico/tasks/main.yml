# =============================================================================
# roles/calico/tasks/main.yml
# =============================================================================
# Install Calico CNI (Container Networking Interface) via its official
# Kubernetes manifest.
#
# =============================================================================
# WHY THIS APPROACH?
# =============================================================================
#
# Older Calico releases shipped standalone CNI binary tarballs that were
# downloaded and extracted onto each node. Starting with Calico v3.26+,
# the project stopped providing those tarballs — the CNI binaries are now
# bundled inside the calico-node container image and automatically deployed
# onto every node by a DaemonSet.
#
# The modern, supported approach is:
#   kubectl apply -f https://raw.githubusercontent.com/projectcalico/calico/\
#                      {{ calico_manifest_version }}/manifests/calico.yaml
#
# This single command creates all required resources:
#   - CustomResourceDefinitions (BGPPeer, IPPool, FelixConfiguration, …)
#   - calico-node DaemonSet (installs CNI binaries + config on every node)
#   - calico-kube-controllers Deployment (manages IPAM, policies, etc.)
#   - RBAC roles, ServiceAccounts, ConfigMaps, and more
#
# The command only needs to run ONCE on the primary control-plane node.
#
# =============================================================================
# WHY NO MANUAL API ENDPOINT INJECTION?
# =============================================================================
#
# Older Calico guides recommended injecting KUBERNETES_SERVICE_HOST and
# KUBERNETES_SERVICE_PORT environment variables into the calico-node
# DaemonSet container specs. This is NOT needed in a properly configured
# kubeadm cluster because:
#
#   1. Calico uses the in-cluster Kubernetes service (kubernetes.default.svc)
#      via the Pod's ServiceAccount token — this works without any manual
#      endpoint configuration.
#
#   2. The Kubernetes service (10.96.0.1:443) is routed by kube-proxy to
#      the API servers through HAProxy. Injecting a direct master IP
#      bypasses this abstraction and defeats HA.
#
#   3. kubeadm init was run with --control-plane-endpoint=HAProxy_IP:6443,
#      so Calico's auto-detected endpoint already resolves correctly.
#
# The role simply:
#   1. Applies the upstream Calico manifest
#   2. Waits for the calico-node DaemonSet to be ready
#   3. Displays the result
# =============================================================================

---
- name: Install Calico network plugin via upstream manifest
  ansible.builtin.command: >
    kubectl apply --kubeconfig /etc/kubernetes/admin.conf -f
    https://raw.githubusercontent.com/projectcalico/calico/{{ calico_manifest_version }}/manifests/calico.yaml
  register: calico_install_result
  changed_when:
    - '"created" in calico_install_result.stdout or "configured" in calico_install_result.stdout'
  run_once: true
  delegate_to: "{{ kubernetes_primary_master }}"
  tags:
    - calico

- name: Wait for calico-node DaemonSet rollout to complete
  ansible.builtin.command: >
    kubectl rollout status daemonset/calico-node -n kube-system
    --kubeconfig /etc/kubernetes/admin.conf
    --timeout=180s
  register: calico_wait_result
  changed_when: false
  run_once: true
  delegate_to: "{{ kubernetes_primary_master }}"
  # Rollout status returns 0 once all pods are ready, which is more reliable
  # than checking the DaemonSet's Available condition.
  retries: 3
  delay: 10
  until: calico_wait_result.rc == 0
  tags:
    - calico

- name: Display Calico installation result
  ansible.builtin.debug:
    var: calico_install_result.stdout_lines
  run_once: true
  tags:
    - calico
    - verify
