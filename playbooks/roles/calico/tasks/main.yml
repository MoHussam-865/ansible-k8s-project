# =============================================================================
# roles/calico/tasks/main.yml
# =============================================================================
# Install Calico CNI (Container Networking Interface) via its official
# Kubernetes manifest.
#
# =============================================================================
# WHY THIS APPROACH?
# =============================================================================
#
# Older Calico releases shipped standalone CNI binary tarballs that were
# downloaded and extracted onto each node. Starting with Calico v3.26+,
# the project stopped providing those tarballs — the CNI binaries are now
# bundled inside the calico-node container image and automatically deployed
# onto every node by a DaemonSet.
#
# The modern, supported approach is:
#   kubectl apply -f https://raw.githubusercontent.com/projectcalico/calico/\
#                      {{ calico_manifest_version }}/manifests/calico.yaml
#
# This single command creates all required resources:
#   - CustomResourceDefinitions (BGPPeer, IPPool, FelixConfiguration, …)
#   - calico-node DaemonSet (installs CNI binaries + config on every node)
#   - calico-kube-controllers Deployment (manages IPAM, policies, etc.)
#   - RBAC roles, ServiceAccounts, ConfigMaps, and more
#
# The command only needs to run ONCE on the control-plane node.
# =============================================================================

---
- name: Determine the actual API server endpoint
  ansible.builtin.set_fact:
    calico_api_host: "{{ hostvars[groups['control-plane'][0]]['ansible_facts']['default_ipv4']['address'] }}"
    calico_api_port: "{{ kubernetes_api_port | default('6443') }}"
  run_once: true
  tags:
    - calico

# ============================================================================
# The Calico manifest contains multiple YAML documents (Namespace,
# ConfigMap, DaemonSet, RBAC, etc.).  Patching the offline file via
# 'kubectl patch --local --type json' fails because the JSON patch is
# applied to EVERY document in the file, and most resources don't have
# a path like '/spec/template/spec/containers/0/env/-'.
#
# Strategy:
#   1. Apply the upstream manifest as-is (creates all resources).
#   2. Patch the *live* calico-node DaemonSet with the real API endpoint.
#   3. The DaemonSet controller will roll out the change to all nodes.
# ============================================================================

- name: Install Calico network plugin via upstream manifest
  ansible.builtin.command: >
    kubectl apply --kubeconfig /etc/kubernetes/admin.conf -f
    https://raw.githubusercontent.com/projectcalico/calico/{{ calico_manifest_version }}/manifests/calico.yaml
  register: calico_install_result
  changed_when: '"created" in calico_install_result.stdout or "configured" in calico_install_result.stdout'
  run_once: true
  tags:
    - calico

- name: Inject real API server endpoint into calico-node DaemonSet (main container)
  ansible.builtin.command: >
    kubectl set env --kubeconfig /etc/kubernetes/admin.conf
    daemonset/calico-node -n kube-system
    KUBERNETES_SERVICE_HOST={{ calico_api_host }}
    KUBERNETES_SERVICE_PORT={{ calico_api_port }}
  register: calico_env_patch
  changed_when: '"updated" in calico_env_patch.stdout'
  run_once: true
  tags:
    - calico

- name: Inject real API server endpoint into install-cni init container
  ansible.builtin.command:
    cmd: >-
      kubectl patch --kubeconfig /etc/kubernetes/admin.conf
      daemonset/calico-node -n kube-system --type json
      --patch='[{"op":"add","path":"/spec/template/spec/initContainers/1/env/-","value":{"name":"KUBERNETES_SERVICE_HOST","value":"{{ calico_api_host }}"}},{"op":"add","path":"/spec/template/spec/initContainers/1/env/-","value":{"name":"KUBERNETES_SERVICE_PORT","value":"{{ calico_api_port }}"}}]'
  register: calico_init_patch
  changed_when: '"patched" in calico_init_patch.stdout'
  run_once: true
  tags:
    - calico

- name: Restart calico-node DaemonSet to pick up env var changes
  ansible.builtin.command: >
    kubectl rollout restart --kubeconfig /etc/kubernetes/admin.conf
    daemonset/calico-node -n kube-system
  register: calico_restart
  changed_when: '"restarted" in calico_restart.stdout'
  run_once: true
  tags:
    - calico

- name: Display Calico installation result
  ansible.builtin.debug:
    var: calico_install_result.stdout_lines
  run_once: true
  tags:
    - calico
    - verify
