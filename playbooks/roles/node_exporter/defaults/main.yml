# =============================================================================
# roles/node_exporter/defaults/main.yml
# =============================================================================
# Default variables for the Prometheus Node Exporter role.
# =============================================================================

---

# ---------------------------------------------------------------------------
# Node Exporter version and download settings
# ---------------------------------------------------------------------------

# Version to install — matches a GitHub release tag
node_exporter_version: "2.30.0"

# Port the node exporter listens on for Prometheus to scrape
node_exporter_port: 9100

# Base install directory
node_exporter_install_dir: /opt/node_exporter

# Download URL — official Prometheus GitHub releases
node_exporter_download_url: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-amd64.tar.gz"

# ---------------------------------------------------------------------------
# Feature flags
# ---------------------------------------------------------------------------

# Whether to install and configure Node Exporter
run_node_exporter_role: true

# Whether to enable the Node Exporter service on boot
node_exporter_service_enabled: true

# Node Exporter systemd service name (can be overridden in group_vars)
node_exporter_service_name: prometheus-node-exporter

# Service state after installation
node_exporter_service_state: started