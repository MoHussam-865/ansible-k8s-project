# =============================================================================
# roles/node_exporter/tasks/main.yml
# =============================================================================
# Install and configure Prometheus Node Exporter for system metrics.
#
# Node Exporter runs on EVERY Kubernetes node (control-plane + workers)
# and exposes system metrics (CPU, memory, disk, network, etc.) on port 9100.
# Prometheus scrapes this endpoint to build a full cluster monitoring picture.
#
# Installation approach:
#   Install the prometheus-node-exporter package from the standard Ubuntu APT
#   repository (available since Ubuntu 22.04), enable and start its systemd
#   service, then verify it is listening on port 9100.
# =============================================================================

---

# =============================================================================
# TASK 1: Install Node Exporter via APT
# =============================================================================

- name: Install prometheus-node-exporter package
  ansible.builtin.apt:
    name: prometheus-node-exporter
    state: present
    update_cache: true
  become: true
  when: run_node_exporter_role | bool
  tags:
    - node_exporter
    - install

# =============================================================================
# TASK 2: Enable and start Node Exporter service
# =============================================================================

- name: Enable and start Node Exporter service
  ansible.builtin.service:
    name: "{{ node_exporter_service_name }}"
    state: "{{ node_exporter_service_state }}"
    enabled: "{{ node_exporter_service_enabled }}"
  become: true
  when: run_node_exporter_role | bool
  tags:
    - node_exporter
    - service

# =============================================================================
# TASK 3: Verify Node Exporter is listening
# =============================================================================

- name: Wait for Node Exporter to be ready
  ansible.builtin.wait_for:
    port: "{{ node_exporter_port }}"
    host: "{{ ansible_facts['default_ipv4']['address'] }}"
    timeout: 30
    connect_timeout: 2
  become: true
  when: run_node_exporter_role | bool
  tags:
    - node_exporter
    - verify