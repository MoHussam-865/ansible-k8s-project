# =============================================================================
# playbooks/kubernetes-cluster.yml
# =============================================================================
# The MAIN Kubernetes provisioning playbook.
#
# Purpose:
#   Run the FULL provisioning pipeline:
#   - Common OS prep (common role)
#   - Container runtime (containerd role)
#   - Kubernetes binaries (kubernetes role)
#   - Control plane init (first master only) — kubeadm init
#   - CNI networking (calico role) — BEFORE additional nodes join
#   - Additional masters join (control-plane role continued)
#   - Worker join (worker role)
#
# Usage:
#   ansible-playbook playbooks/kubernetes-cluster.yml
#
# Play order matters:
#   Play 1: ALL nodes — install base stack (common + containerd + kubernetes)
#   Play 2: FIRST control-plane only — kubeadm init
#   Play 3: FIRST control-plane only — install Calico CNI via kubectl apply manifest
#   Play 4: REST of control-plane — kubeadm join --control-plane
#   Play 5: workers — kubeadm join through HAProxy
#
# Why Calico before joining additional nodes?
#   - Pods (including calico-node DaemonSet) require networking to
#     communicate across nodes
#   - The calico-node DaemonSet deploys CNI plugin binaries onto every
#     node that joins the cluster
#   - Without CNI, core DNS (CoreDNS) and other critical pods remain
#     in Pending state (no network available)
#   - kubelet on newly joining nodes reports NotReady until CNI is
#     operational
#   - Installing Calico after join triggers unnecessary node status
#     transitions (NotReady -> Ready) and may require kubelet restart
# =============================================================================

---
# =============================================================================
# PLAY 1: Install base stack on ALL nodes
# =============================================================================
# This runs the kubernetes role, which has a dependency chain:
#   kubernetes -> containerd -> common
# All three roles execute in order on every host.
# =============================================================================

- name: PLAY 1 — Install base stack (common + containerd + kubernetes)
  hosts: all
  gather_facts: true
  become: true

  pre_tasks:
    - name: Display provisioning target
      ansible.builtin.debug:
        msg: "Provisioning {{ ansible_hostname }} as a Kubernetes {{ kubernetes_role | default('node') }}."
      tags:
        - always

  roles:
    - role: kubernetes
      tags:
        - kubernetes

  post_tasks:
    - name: Base stack installed
      ansible.builtin.debug:
        msg: "Base stack installed on {{ ansible_hostname }}."
      tags:
        - always
# =============================================================================
# PLAY 2: Initialize the FIRST control-plane node only
# =============================================================================
# Runs ONLY on the first control-plane host. This play:
#   - Runs 'kubeadm init' to bootstrap the cluster
#   - Captures the join command and certificate key for later use
#   - Deploys kubelet configuration and admin.conf on the first master
#
# IMPORTANT:
#   Only the FIRST master is initialized here. Additional masters join
#   AFTER Calico CNI is installed (Play 3). This ensures the control-plane
#   already has pod networking operational when additional masters attach.
# =============================================================================

- name: PLAY 2 — Initialize first control-plane node (kubeadm init)
  hosts: control-plane[0]
  gather_facts: true
  become: true

  roles:
    - role: control-plane
      tags:
# =============================================================================
# PLAY 3: Install Calico CNI networking BEFORE additional nodes join
# =============================================================================
# Pods need network connectivity to communicate. We install Calico via its
# official Kubernetes manifest BEFORE additional masters or workers join.
#
# WHY CALICO BEFORE JOIN?
#   + The calico-node DaemonSet runs on ALL nodes, deploying CNI plugin
#     binaries onto each node's filesystem via hostPath mounts.
#   + When a new node joins the cluster, kubelet immediately expects CNI
#     to be available. If CNI isn't installed yet, the node stays NotReady
#     until the calico-node pod lands on it.
#   + Installing CNI first means newly joining nodes find CNI already
#     present and transition to Ready immediately.
#   + CoreDNS and other critical system pods start successfully because
#     pod networking is available from the start.
#
# IMPORTANT:
#   This play targets ONLY the first control-plane node. The kubectl apply
#   command only needs to run once — the Calico DaemonSet then deploys the
#   CNI plugin binaries and configuration onto EVERY node automatically
#   as they join the cluster.
# =============================================================================

- name: PLAY 3 — Install Calico CNI networking (before nodes join)
  hosts: control-plane[0]
  gather_facts: true
  become: true

  roles:
    - role: calico
      tags:
        - calico

  post_tasks:
    - name: Calico manifest applied
      ansible.builtin.debug:
        msg: "Calico manifest applied from control-plane {{ ansible_hostname }}. CNI DaemonSet will install on all current and future nodes."
      tags:
        - always

# =============================================================================
# PLAY 4: Join remaining control-plane nodes (additional masters)
# =============================================================================
# Runs on ALL control-plane hosts EXCEPT the first one.
# Additional masters join with:
#   kubeadm join --control-plane --certificate-key=<key>
#
# The join command and certificate key were captured from the first master
# in Play 2 and are available via hostvars or the persisted files.
#
# By this point, Calico CNI is already installed on the first master,
# so the calico-node DaemonSet will automatically deploy CNI onto each
# new master as it joins the cluster.
# =============================================================================

- name: PLAY 4 — Join remaining control-plane nodes (--control-plane)
  hosts: control-plane
  gather_facts: true
  become: true

  pre_tasks:
    - name: Skip the first master (already initialized)
      ansible.builtin.meta: end_host
      when: inventory_hostname == groups['control-plane'][0]
      tags:
        - control-plane

  roles:
    - role: control-plane
      tags:
        - control-plane

  post_tasks:
    - name: Additional control-plane node joined
      ansible.builtin.debug:
        msg: "Control-plane {{ ansible_hostname }} has joined the cluster."
      tags:
        - always

# =============================================================================
# PLAY 5: Join workers to the cluster
# =============================================================================
# Runs ONLY on the workers group.
# Each worker retrieves the join command from the first control plane (via hostvars)
# and runs 'kubeadm join' to attach to the cluster through HAProxy.
#
# By this point, Calico CNI is already installed, so workers transition
# to Ready immediately after joining.
# =============================================================================

- name: PLAY 5 — Join workers to the cluster
  hosts: workers
  gather_facts: true
  become: true

  pre_tasks:
    - name: Wait for control plane API to be reachable from worker
      ansible.builtin.wait_for:
        host: "{{ hostvars[groups['control-plane'][0]]['ansible_host'] | default(hostvars[groups['control-plane'][0]]['inventory_hostname'], true) }}"
        port: "{{ kubernetes_api_port | default('6443') }}"
        timeout: 120
        connect_timeout: 2
      delegate_to: "{{ groups['control-plane'][0] }}"
      tags:
        - worker

  roles:
    - role: worker
      tags:
        - worker

  post_tasks:
    - name: Worker joined
      ansible.builtin.debug:
        msg: "Worker {{ ansible_hostname }} has joined the cluster."
      tags:
        - always
