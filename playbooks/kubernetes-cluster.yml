# =============================================================================
# playbooks/kubernetes-cluster.yml
# =============================================================================
# The MAIN Kubernetes provisioning playbook — Stages 5-10.
#
# Purpose:
#   Run the FULL provisioning pipeline:
#   - Common OS prep (common role)
#   - Container runtime (containerd role)
#   - Kubernetes binaries (kubernetes role)
#   - Control plane init (control-plane role) — first master
#   - Additional masters join (control-plane role)
#   - Worker join (worker role)
#   - CNI networking (calico role)
#
# Usage:
#   ansible-playbook playbooks/kubernetes-cluster.yml
#
# Play order matters:
#   Play 1: ALL nodes — install base stack (common → containerd → kubernetes)
#   Play 2: control-plane (first only) — kubeadm init with HAProxy endpoint + upload certs
#   Play 3: control-plane (rest) — kubeadm join --control-plane (NEW)
#   Play 4: workers — kubeadm join through HAProxy
#   Play 5: control-plane (first only) — install Calico CNI via kubectl apply manifest
#
# Why this order?
#   - kubeadm init MUST run BEFORE kubeadm join (obviously)
#   - Additional masters need the certificate key from the first master
#   - Workers need the cluster to be initialized first
#   - CNI can run anytime after containerd is installed
#   - We split into 5 plays to ensure execution order
# =============================================================================

---
# =============================================================================
# PLAY 1: Install base stack on ALL nodes
# =============================================================================
# This runs the kubernetes role, which has a dependency chain:
#   kubernetes -> containerd -> common
# All three roles execute in order on every host.
# =============================================================================

- name: PLAY 1 — Install base stack (common + containerd + kubernetes)
  hosts: all
  gather_facts: true
  become: true

  pre_tasks:
    - name: Display provisioning target
      ansible.builtin.debug:
        msg: "Provisioning {{ ansible_hostname }} as a Kubernetes {{ kubernetes_role | default('node') }}."
      tags:
        - always

  roles:
    - role: kubernetes
      tags:
        - kubernetes

  post_tasks:
    - name: Base stack installed
      ansible.builtin.debug:
        msg: "Base stack installed on {{ ansible_hostname }}."
      tags:
        - always

# =============================================================================
# PLAY 2: Initialize first control plane
# =============================================================================
# Runs on the FIRST host of the control-plane group only.
# 'kubeadm init' bootstraps the cluster with HAProxy endpoint,
# uploads certificates, and generates the join command + cert key.
# The join command and cert key are captured via register and shared
# via set_fact for additional masters and workers.
# =============================================================================

- name: PLAY 2 — Initialize first control plane with kubeadm
  hosts: control-plane[0]
  gather_facts: true
  become: true

  roles:
    - role: control-plane
      tags:
        - control-plane

  post_tasks:
    - name: First control plane initialized
      ansible.builtin.debug:
        msg: "First control plane {{ ansible_hostname }} initialized with HAProxy endpoint."
      tags:
        - always

# =============================================================================
# PLAY 3: Join additional control-plane nodes
# =============================================================================
# Runs on ALL control-plane hosts EXCEPT the first one (already initialized).
# Additional masters run 'kubeadm join --control-plane' using the certificate
# key generated by the first master during kubeadm init --upload-certs.
#
# Multi-master flow:
#   1. First master runs kubeadm init with --upload-certs
#   2. Additional masters join with kubeadm join --control-plane --certificate-key=<key>
#   3. All masters serve the Kubernetes API on port 6443
#   4. HAProxy load-balances across all masters
# =============================================================================

- name: PLAY 3 — Join additional masters to the cluster
  hosts: control-plane
  gather_facts: true
  become: true
  # Skip the first control-plane node (already initialized in Play 2)
  vars:
    is_first_master: "{{ ansible_hostname == hostvars[groups['control-plane'][0]].ansible_hostname }}"

  pre_tasks:
    - name: Wait for first control plane to be ready
      ansible.builtin.wait_for:
        host: "{{ hostvars[groups['control-plane'][0]].ansible_facts.default_ipv4.address }}"
        port: "{{ kubernetes_api_port | default('6443') }}"
        timeout: 120
        connect_timeout: 2
      delegate_to: "{{ groups['control-plane'][0] }}"
      when: not is_first_master
      tags:
        - control-plane
        - multi-master

    - name: Retrieve certificate key from first master
      ansible.builtin.set_fact:
        master_certificate_key: "{{ hostvars[groups['control-plane'][0]]['kubeadm_certificate_key_raw'] | default('') }}"
      when: not is_first_master
      tags:
        - control-plane
        - multi-master

    - name: Retrieve join command from first master
      ansible.builtin.set_fact:
        master_join_command: "{{ hostvars[groups['control-plane'][0]]['kubeadm_join_command_raw'] | default('') }}"
      when: not is_first_master
      tags:
        - control-plane
        - multi-master

    - name: Build full join command with --control-plane flag
      ansible.builtin.set_fact:
        master_full_join_command: "{{ master_join_command }} --control-plane --certificate-key={{ master_certificate_key }}"
      when:
        - not is_first_master
        - master_join_command | length > 0
        - master_certificate_key | length > 0
      tags:
        - control-plane
        - multi-master

  tasks:
    - name: Check if node already joined
      ansible.builtin.stat:
        path: /etc/kubernetes/pki/ca.crt
      register: additional_ca_check
      when: not is_first_master
      tags:
        - control-plane
        - multi-master

    - name: Join the cluster as an additional master
      ansible.builtin.command:
        cmd: "{{ master_full_join_command }}"
      become: true
      when:
        - not is_first_master
        - master_full_join_command is defined
        - master_full_join_command | length > 0
        - not additional_ca_check.stat.exists
      register: additional_master_join_result
      changed_when: additional_master_join_result.rc == 0
      tags:
        - control-plane
        - multi-master

  post_tasks:
    - name: Additional master joined
      ansible.builtin.debug:
        msg: "Additional master {{ ansible_hostname }} has joined the cluster."
      when: not is_first_master
      tags:
        - always

# =============================================================================
# PLAY 4: Join workers to the cluster
# =============================================================================
# Runs ONLY on the workers group.
# Each worker retrieves the join command from the first control plane (via hostvars)
# and runs 'kubeadm join' to attach to the cluster through HAProxy.
# =============================================================================

- name: PLAY 4 — Join workers to the cluster
  hosts: workers
  gather_facts: true
  become: true

  pre_tasks:
    - name: Wait for HAProxy or first control plane to be ready
      ansible.builtin.wait_for:
        host: "{{ hostvars[groups['haproxy'][0] | default(groups['control-plane'][0])].ansible_facts.default_ipv4.address }}"
        port: "{{ kubernetes_api_port | default('6443') }}"
        timeout: 120
        connect_timeout: 2
      delegate_to: "{{ groups['haproxy'][0] | default(groups['control-plane'][0]) }}"
      tags:
        - worker

  roles:
    - role: worker
      tags:
        - worker

  post_tasks:
    - name: Worker joined
      ansible.builtin.debug:
        msg: "Worker {{ ansible_hostname }} has joined the cluster."
      tags:
        - always

# =============================================================================
# PLAY 5: Install Calico CNI networking on the control plane
# =============================================================================
# Pods need network connectivity to communicate. We install Calico via its
# official Kubernetes manifest.
#
# IMPORTANT:
#   This play targets ONLY the first control-plane node. The kubectl apply command
#   only needs to run once — the Calico DaemonSet then deploys the CNI
#   plugin binaries and configuration onto EVERY node automatically.
# =============================================================================

- name: PLAY 5 — Install Calico CNI networking
  hosts: control-plane[0]
  gather_facts: true
  become: true

  roles:
    - role: calico
      tags:
        - calico

  post_tasks:
    - name: Calico manifest applied
      ansible.builtin.debug:
        msg: "Calico manifest applied from control-plane {{ ansible_hostname }}. CNI DaemonSet will install on all nodes."
      tags:
        - always
