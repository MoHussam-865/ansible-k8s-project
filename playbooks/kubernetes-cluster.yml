# =============================================================================
# playbooks/kubernetes-cluster.yml
# =============================================================================
# The MAIN Kubernetes provisioning playbook — Stages 5-10.
#
# Purpose:
#   Run the FULL provisioning pipeline:
#   - Common OS prep (common role)
#   - Container runtime (containerd role)
#   - Kubernetes binaries (kubernetes role)
#   - Control plane init + join (control-plane role) — all masters
#   - Worker join (worker role)
#   - CNI networking (calico role)
#
# Usage:
#   ansible-playbook playbooks/kubernetes-cluster.yml
#
# Play order matters:
#   Play 1: ALL nodes — install base stack (common → containerd → kubernetes)
#   Play 2: ALL control-plane — kubeadm init (first) + join --control-plane (rest)
#   Play 3: workers — kubeadm join through HAProxy
#   Play 4: control-plane (first only) — install Calico CNI via kubectl apply manifest
#
# Why this order?
#   - kubeadm init MUST run BEFORE kubeadm join (obviously)
#   - Workers need the cluster to be initialized first
#   - CNI can run anytime after containerd is installed
#   - The control-plane role handles ordering: run_once tasks on the first
#     master finish BEFORE additional masters attempt to join
#   - All control-plane nodes get kubelet config, admin.conf, and kubelet
#     service configured after joining
# =============================================================================

---
# =============================================================================
# PLAY 1: Install base stack on ALL nodes
# =============================================================================
# This runs the kubernetes role, which has a dependency chain:
#   kubernetes -> containerd -> common
# All three roles execute in order on every host.
# =============================================================================

- name: PLAY 1 — Install base stack (common + containerd + kubernetes)
  hosts: all
  gather_facts: true
  become: true

  pre_tasks:
    - name: Display provisioning target
      ansible.builtin.debug:
        msg: "Provisioning {{ ansible_hostname }} as a Kubernetes {{ kubernetes_role | default('node') }}."
      tags:
        - always

  roles:
    - role: kubernetes
      tags:
        - kubernetes

  post_tasks:
    - name: Base stack installed
      ansible.builtin.debug:
        msg: "Base stack installed on {{ ansible_hostname }}."
      tags:
        - always

# =============================================================================
# PLAY 2: Initialize / join ALL control-plane nodes
# =============================================================================
# Runs on ALL control-plane hosts. The control-plane role handles both:
#   - FIRST MASTER:  kubeadm init with HAProxy endpoint + upload-certs
#   - REST MASTERS:  kubeadm join --control-plane --certificate-key=<key>
#
# Why this works in a single play:
#   First-master tasks use run_once: true, which makes ALL hosts wait
#   for them to complete. By the time additional master tasks run,
#   the cluster exists and hostvars have the join command + cert key.
#
# After initialization/join, kubelet configuration, service start,
# and admin.conf copy run on EVERY control-plane node.
# =============================================================================

- name: PLAY 2 — Bootstrap all control-plane nodes (init + join)
  hosts: control-plane
  gather_facts: true
  become: true

  roles:
    - role: control-plane
      tags:
        - control-plane

  post_tasks:
    - name: Control-plane node ready
      ansible.builtin.debug:
        msg: "Control-plane {{ ansible_hostname }} is ready."
      tags:
        - always

# =============================================================================
# PLAY 3: Join workers to the cluster
# =============================================================================
# Runs ONLY on the workers group.
# Each worker retrieves the join command from the first control plane (via hostvars)
# and runs 'kubeadm join' to attach to the cluster through HAProxy.
# =============================================================================

- name: PLAY 3 — Join workers to the cluster
  hosts: workers
  gather_facts: true
  become: true

  pre_tasks:
    - name: Wait for control plane API to be reachable from worker
      ansible.builtin.wait_for:
        host: "{{ hostvars[groups['control-plane'][0]]['ansible_host'] }}"
        port: "{{ kubernetes_api_port | default('6443') }}"
        timeout: 120
        connect_timeout: 2
      delegate_to: "{{ groups['control-plane'][0] }}"
      tags:
        - worker

  roles:
    - role: worker
      tags:
        - worker

  post_tasks:
    - name: Worker joined
      ansible.builtin.debug:
        msg: "Worker {{ ansible_hostname }} has joined the cluster."
      tags:
        - always

# =============================================================================
# PLAY 4: Install Calico CNI networking on the control plane
# =============================================================================
# Pods need network connectivity to communicate. We install Calico via its
# official Kubernetes manifest.
#
# IMPORTANT:
#   This play targets ONLY the first control-plane node. The kubectl apply command
#   only needs to run once — the Calico DaemonSet then deploys the CNI
#   plugin binaries and configuration onto EVERY node automatically.
# =============================================================================

- name: PLAY 4 — Install Calico CNI networking
  hosts: control-plane[0]
  gather_facts: true
  become: true

  roles:
    - role: calico
      tags:
        - calico

  post_tasks:
    - name: Calico manifest applied
      ansible.builtin.debug:
        msg: "Calico manifest applied from control-plane {{ ansible_hostname }}. CNI DaemonSet will install on all nodes."
      tags:
        - always
