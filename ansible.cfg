# =============================================================================
# ansible.cfg
# =============================================================================
# This is the FIRST file Ansible looks for when it runs.
#
# Ansible searches for ansible.cfg in this order:
#   1. ANSIBLE_CONFIG  (environment variable)
#   2. ./ansible.cfg   (current working directory)
#   3. ~/.ansible.cfg  (user home directory)
#   4. /etc/ansible/ansible.cfg
#
# By placing ansible.cfg in the project root we ensure EVERYONE on the team
# uses the SAME settings.  The file is OPTIONAL (Ansible works without it)
# but in a PROFESSIONAL project you ALWAYS include it to pin behaviour.
# =============================================================================

[defaults]
# ---------------------------------------------------------------------------
# inventory
# ---------------------------------------------------------------------------
# Path(s) to your inventory files.  Ansible loads these to learn what hosts
# exist and what groups they belong to.  In production we point to a DIRECTORY
# so we can split hosts, group_vars, and host_vars into separate files.
# ---------------------------------------------------------------------------
inventory = ./hosts

# ---------------------------------------------------------------------------
# remote_user
# ---------------------------------------------------------------------------
# The SSH user Ansible uses to log into managed nodes.
# ---------------------------------------------------------------------------
remote_user = ansadmin

# ---------------------------------------------------------------------------
# host_key_checking
# ---------------------------------------------------------------------------
# When True, Ansible verifies the remote host's SSH key against
# ~/.ssh/known_hosts.  Keep True in PRODUCTION.  Set False for home lab
# to skip first-connect prompts.  NEVER disable in real prod.
# ---------------------------------------------------------------------------
host_key_checking = False

# ---------------------------------------------------------------------------
# gather_facts
# ---------------------------------------------------------------------------
# Whether Ansible collects system info (OS, IP, memory, disk, etc.) from
# every host BEFORE running tasks.  Facts power dynamic decisions like
# "install this package only on Ubuntu".
# ---------------------------------------------------------------------------
gather_facts = True

# ---------------------------------------------------------------------------
# forks
# ---------------------------------------------------------------------------
# How many hosts Ansible talks to IN PARALLEL.  Default 5.  For our 3-node
# cluster 5 is plenty.  Raise to 50+ for large fleets.
# ---------------------------------------------------------------------------
forks = 5

# ---------------------------------------------------------------------------
# timeout
# ---------------------------------------------------------------------------
# SSH connection timeout in seconds.  30s is safe for slow VMs.
# ---------------------------------------------------------------------------
timeout = 30

# ---------------------------------------------------------------------------
# retry_files_enabled / retry_files_save_path
# ---------------------------------------------------------------------------
# When a playbook fails Ansible can save a .retry file with the failed hosts.
# Re-run with: ansible-playbook site.yml --limit @site.retry
# ---------------------------------------------------------------------------
retry_files_enabled = True
retry_files_save_path = ./retry-files/

# ---------------------------------------------------------------------------
# fact_caching — speed up repeated runs by caching facts to disk
# ---------------------------------------------------------------------------
# Without caching, Ansible gathers facts EVERY time you run a playbook,
# even if the hosts haven't changed.  This adds 2-5 seconds per host.
#
#   backend = jsonfile   — store facts as JSON files on the controller
#   connection = path    — where to store the cache files
#   timeout = 86400      — cache lives 24 hours before re-gathering
#
# Trade-off: cached facts are STATIC until they expire.
# If a host changes its IP or OS between runs, force a re-gather with:
#   ansible-playbook ... --flush-cache
# ---------------------------------------------------------------------------
fact_caching = jsonfile
fact_caching_connection = ./cache/facts
fact_caching_timeout = 86400

# ---------------------------------------------------------------------------
# log_path — write Ansible output to a log file as well as stdout
# ---------------------------------------------------------------------------
# Useful for debugging, auditing, and reviewing what changed.
# Set to a writable path.  Clean it periodically.
# ---------------------------------------------------------------------------
log_path = ./ansible.log

# ---------------------------------------------------------------------------
# callbacks_enabled
# ---------------------------------------------------------------------------
# Extra callback plugins to load.  profile_tasks prints timing info per task.
# ---------------------------------------------------------------------------
callbacks_enabled = ansible.posix.profile_tasks, ansible.posix.timer

# ---------------------------------------------------------------------------
# show_custom_stats
# ---------------------------------------------------------------------------
# Print a summary of the time spent in each play/role at the end.
# ---------------------------------------------------------------------------
show_custom_stats = True

# ---------------------------------------------------------------------------
# deprecation_warnings
# ---------------------------------------------------------------------------
# Show warnings for features that will be removed in a future version.
# ---------------------------------------------------------------------------
deprecation_warnings = True

# ---------------------------------------------------------------------------
# interpreter_python
# ---------------------------------------------------------------------------
# Which Python interpreter Ansible uses on the managed node.
# auto_silent finds the right one without warning messages.
# ---------------------------------------------------------------------------
interpreter_python = auto_silent

# ---------------------------------------------------------------------------
# system_warnings
# ---------------------------------------------------------------------------
# Ansible can warn about things like "you are running as root".  Keep on.
# ---------------------------------------------------------------------------
system_warnings = True

# ---------------------------------------------------------------------------
# error_on_undefined_variable
# ---------------------------------------------------------------------------
# Stricter variable handling — fail immediately if a variable is undefined
# instead of silently using an empty string.  Helps catch typos early.
# ---------------------------------------------------------------------------
error_on_undefined_variable = True

# ---------------------------------------------------------------------------
# nocows — disable the cow for ASCII art banners
# ---------------------------------------------------------------------------
nocows = 1


# =============================================================================
# [ssh_connection]
# =============================================================================
# Settings for how Ansible connects via SSH.  Ansible uses OpenSSH since 2.0.
# -----------------------------------------------------------------------------

[ssh_connection]

# ---------------------------------------------------------------------------
# pipelining
# ---------------------------------------------------------------------------
# Sends multiple actions through a SINGLE SSH connection instead of opening
# a new connection per action.  2-3x faster.  ALWAYS enable in production.
# ---------------------------------------------------------------------------
pipelining = True

# ---------------------------------------------------------------------------
# ssh_args
# ---------------------------------------------------------------------------
# Raw arguments to the ssh command.
#   ControlMaster=auto   = reuse a single SSH connection for multiple sessions
#   ControlPersist=60s   = keep the connection alive for 60s after use
# ---------------------------------------------------------------------------
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ForwardAgent=yes

# private_key_file is now set via environment variable ANSIBLE_PRIVATE_KEY_FILE
# or left to SSH defaults. Hardcoded paths are removed for portability.
#private_key_file = /home/ansadmin/.ssh/id_rsa

# ---------------------------------------------------------------------------
# scp_if_ssh
# ---------------------------------------------------------------------------
# Force SCP for file transfers even when SFTP is available.  Leave False.
# ---------------------------------------------------------------------------
scp_if_ssh = False


# =============================================================================
# [galaxy]
# =============================================================================
# Settings for ansible-galaxy (role/collection installer).
# -----------------------------------------------------------------------------

[galaxy]
server_list = release_servers

[galaxy_server.release_servers]
url = https://galaxy.ansible.com


# =============================================================================
# [inventory]
# =============================================================================
# Inventory plugin configuration.
# -----------------------------------------------------------------------------

[inventory]
# Enable plugins so we can use auto-detected ini / yaml / constructed inventories
enable_plugins = auto, ini, yaml, constructed
