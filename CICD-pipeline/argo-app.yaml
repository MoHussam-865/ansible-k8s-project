# ============================================================================
# ArgoCD Application — MicroCRM
# ============================================================================
#
# This manifest tells ArgoCD WHAT to deploy and WHERE to find it.
# ArgoCD continuously watches the Kubernetes manifests repository.
# When it detects a new commit (pushed by Jenkins), ArgoCD automatically
# applies the updated manifests to the cluster — this is "GitOps".
#
# Prerequisites:
#   - ArgoCD is installed on your Kubernetes cluster.
#   - The k8s manifests repo is accessible by ArgoCD.
#   - A Kubernetes namespace "microcrm" exists (or ArgoCD will create it).
#
# How to apply this file:
#   kubectl apply -f argo-app.yaml
#
# Then check the ArgoCD UI:
#   kubectl port-forward svc/argocd-server -n argocd 8080:443
#   (open https://localhost:8080)
# ============================================================================

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  # The name ArgoCD uses internally for this application.
  name: microcrm
  # ArgoCD itself runs in the 'argocd' namespace; the Application resource
  # must live there so ArgoCD can discover it.
  namespace: argocd
  # finalizers ensure that when you delete this Application resource,
  # ArgoCD also deletes all associated Kubernetes resources from the cluster.
  finalizers:
    - resources-finalizer.argocd.argoproj.io

spec:
  # --------------------------------------------------------------------------
  #  SOURCE — where the desired state lives (the k8s manifests repo).
  #  ArgoCD watches this repo for changes.
  # --------------------------------------------------------------------------
  source:
    # The Git repository containing Kubernetes YAML files.
    repoURL: https://github.com/MoHussam-865/k8s-micro-services
    # The branch ArgoCD should track (usually 'main').
    targetRevision: main
    # The directory inside the repo where the YAML files reside.
    # If your manifests are at the repo root, use '.'.
    # If they are in a subfolder (e.g. 'overlays/prod'), specify that.
    path: .

  # --------------------------------------------------------------------------
  #  DESTINATION — where ArgoCD deploys the app inside the cluster.
  # --------------------------------------------------------------------------
  destination:
    # The Kubernetes API server to deploy to.
    # 'https://kubernetes.default.svc' means "the cluster ArgoCD is running in".
    server: https://kubernetes.default.svc
    # The namespace to deploy into.
    # ArgoCD will create this namespace if it does not exist
    # (controlled by syncPolicy.automated.prune / syncOptions below).
    namespace: microcrm

  # --------------------------------------------------------------------------
  #  SYNC POLICY — controls automated synchronization behavior.
  # --------------------------------------------------------------------------
  syncPolicy:
    # 'automated' means ArgoCD will auto-sync when it detects a Git change.
    # Without this, you would need to click "Sync" in the ArgoCD UI manually.
    automated:
      # 'prune: true' means ArgoCD will DELETE resources from the cluster
      # that are no longer defined in Git.  This keeps the cluster clean.
      prune: true
      # 'selfHeal: true' means if someone manually changes a resource on the
      # cluster (e.g. kubectl edit), ArgoCD will revert it back to match Git
      # within 3 minutes.  This enforces "Git as the single source of truth".
      selfHeal: true

    # syncOptions fine-tune how ArgoCD applies manifests.
    syncOptions:
      # Create the namespace if it doesn't exist.
      - CreateNamespace=true

      # Validate manifests against the Kubernetes API before applying.
      - Validate=true

      # Prune propagation policy:  'foreground' tells Kubernetes to delete
      # all dependents before deleting the resource itself.
      - PrunePropagationPolicy=foreground

      # 'PruneLast' tells ArgoCD to delete old resources AFTER applying new
      # ones, which minimises downtime during deployments.
      - PruneLast=true

  # ---------------------------------------------------------------------------
  #  PROJECT — ArgoCD project (logical grouping of applications).
  #  'default' is the built-in project.  For production, create a dedicated
  #  project with RBAC restrictions.
  # --------------------------------------------------------------------------
  project: default