# =============================================================================
# inventory/production/group_vars/control-plane.yml  [DEPRECATED]
# =============================================================================
# ⚠  DEPRECATION WARNING  ⚠
# Kept as rollback reference. Primary location is now: group_vars/control-plane.yml
# =============================================================================

---
# The role this node plays in the Kubernetes cluster
kubernetes_role: "control-plane"

# kubeadm init options for the control plane
kubeadm_init_options: "--pod-network-cidr={{ pod_network_cidr }}"

# The version of Kubernetes to install on the control plane
kubernetes_control_plane_version: "{{ kubernetes_version }}"

# IP or hostname that workers use to reach the control plane
# Updated to use dynamic groups[] lookup instead of hardcoded hostname
control_plane_ip: "{{ hostvars[groups['control-plane'][0]]['ansible_host'] | default(hostvars[groups['control-plane'][0]]['inventory_hostname'], true) }}"

# Port for kubeadm init (default: 6443 for the API)
kubernetes_api_port: 6443
