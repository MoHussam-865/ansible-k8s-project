# =============================================================================
# inventory/production/group_vars/all.yml  [DEPRECATED]
# =============================================================================
# ⚠  DEPRECATION WARNING  ⚠
# This directory is kept as a rollback reference only.
# The primary inventory source is now: ./hosts (INventory file at project root)
# Primary group_vars are at: group_vars/*.yml (root level)
#
# Ansible.cfg now points to: inventory = ./hosts
# This directory (inventory/production/) is NO LONGER loaded by default.
#
# To restore old behavior:
#   ansible.cfg  →  inventory = inventory/production/
#
# Remove this file once the new hosts file is verified working.
# =============================================================================

---
# Kubernetes Version Settings
kubernetes_release: "v1.37"
kubernetes_version: "stable"

# Container Runtime
containerd_install_method: "apt"
containerd_version: "1.7.6"
containerd_package: "containerd.io"

# Network Settings
pod_network_cidr: "10.0.0.0/16"

# Kubernetes API endpoint — dynamically resolved from the first control-plane node
kubernetes_api_endpoint: "{{ hostvars[groups['control-plane'][0]]['ansible_facts']['default_ipv4']['address'] }}"

# Kubernetes OS user
kubernetes_user: "root"

# Common packages
common_packages:
  - apt-transport-https
  - ca-certificates
  - curl
  - software-properties-common
  - python3-pip
  - gnupg
  - lsb-release
  - htop
  - net-tools
  - chrony
  - wget

# Kernel Modules
k8s_kernel_modules:
  - overlay
  - br_netfilter
  - ip_vs
  - ip_vs_rr
  - ip_vs_wrr
  - ip_vs_nq
  - ip_vs_lblc
  - ip_vs_lblcr
  - ip_vs_ftp
  - xt_connmark

# sysctl Parameters
k8s_sysctl_settings:
  net.ipv4.ip_forward: 1
  net.bridge.bridge-nf-call-iptables: 1
  net.ipv4.conf.all.rp_filter: 1
  net.core.somaxconn: 1024
  fs.file-max: 2097152
  vm.overcommit_memory: 1
  vm.swappiness: 10

# Feature Flags
run_common_role: true
run_containerd_role: true
run_kubernetes_role: true
